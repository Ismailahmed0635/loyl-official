repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks: [{ id: gitleaks }]
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0
    hooks: [{ id: eslint, args: [--max-warnings=0] }]
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
